name: Rath Auto Build
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
jobs:
  auto-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - run: yarn install
      - run: yarn playwright install --with-deps chromium-headless-shell
      - run: scripts/ui-migration-gates.sh
      - run: yarn audit:tailwind4
      - run: yarn audit:react19
      - run: yarn tsc --noEmit -p packages/rath-client/tsconfig.json
      - run: CI=true yarn workspace rath-client test --runInBand
      - run: yarn workspace rath-client build
      - run: yarn test:smoke
